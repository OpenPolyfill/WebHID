<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iframe Child Forge</title>
  </head>
  <body>
    <script>
      ;(async function () {
        const target = new URL('/iframe-child-with-allow', location.origin).href
        window.Error = function FakeError() {
          this.stack = '@' + target + ':1:1'
        }

        let isCrossOrigin = false
        if (window !== window.top) {
          try {
            window.parent.location.origin
          } catch {
            isCrossOrigin = true
          }
        }

        let getDevices
        try {
          const devices = await navigator.hid.getDevices()
          getDevices = { ok: true, count: devices.length }
        } catch (e) {
          getDevices = { ok: false, name: e.name, message: e.message }
        }

        const hidUndefined = typeof navigator.hid === 'undefined'

        window.tests = window.tests || { helper: {}, results: {} }
        window.tests.results.perm = { isCrossOrigin, getDevices, hidUndefined }
      })()
    </script>
  </body>
</html>
