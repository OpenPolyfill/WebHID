<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Policy Check</title>
  </head>
  <body>
    <script>
      window.tests = window.tests || { helper: {}, results: {} }
      window.tests.helper.requestDeviceDictionaryConversion = async () => {
        const requestDevice = navigator.hid.requestDevice
        const invalidOptions = [
          undefined,
          {},
          { filters: null },
          { filters: {} },
          { filters: [], exclusionFilters: {} },
          { filters: [], exclusionFilters: null },
          { filters: [{ vendorId: Symbol('vendor') }] },
          { filters: [{ productId: BigInt(1) }] }
        ]
        const conversionResults = await Promise.all(
          invalidOptions.map(async (options) => {
            let promise
            try {
              promise = requestDevice.call(navigator.hid, options)
            } catch (error) {
              return {
                returnedPromise: false,
                error: error instanceof Error ? error.name : String(error)
              }
            }
            if (!(promise instanceof Promise)) {
              return { returnedPromise: false, error: 'not a Promise' }
            }
            try {
              await promise
              return { returnedPromise: true, error: 'resolved' }
            } catch (error) {
              return {
                returnedPromise: true,
                error: error instanceof Error ? error.name : String(error)
              }
            }
          })
        )
        const coercionError = new Error('coercion sentinel')
        let coercionReturnedPromise = false
        let coercionErrorPreserved = false
        try {
          const promise = requestDevice.call(navigator.hid, {
            filters: [
              {
                vendorId: {
                  [Symbol.toPrimitive]() {
                    throw coercionError
                  }
                }
              }
            ]
          })
          coercionReturnedPromise = promise instanceof Promise
          if (coercionReturnedPromise) {
            try {
              await promise
            } catch (error) {
              coercionErrorPreserved = error === coercionError
            }
          }
        } catch (error) {
          coercionErrorPreserved = error === coercionError
        }
        const converted = []
        const numericValue = (name, value) => ({
          valueOf() {
            converted.push(name)
            return value
          }
        })
        const filter = Object.create({
          vendorId: numericValue('vendorId', 0x16c0)
        })
        Object.defineProperties(filter, {
          productId: { value: numericValue('productId', 1), enumerable: true },
          usagePage: { value: numericValue('usagePage', 1), enumerable: true },
          usage: { value: numericValue('usage', 1), enumerable: true }
        })
        let convertedAtReturn = []
        let promiseError = null
        let promiseReturned = false
        try {
          const promise = requestDevice.call(navigator.hid, { filters: new Set([filter]) })
          promiseReturned = promise instanceof Promise
          convertedAtReturn = [...converted]
          if (promiseReturned) {
            promiseError = await promise.then(
              () => 'resolved',
              (error) => (error instanceof Error ? error.name : String(error))
            )
          } else {
            promiseError = 'not a Promise'
          }
        } catch (error) {
          convertedAtReturn = [...converted]
          promiseError = `sync:${error instanceof Error ? error.name : String(error)}`
        }
        return {
          conversionResults,
          convertedAtReturn,
          promiseError,
          promiseReturned,
          coercionReturnedPromise,
          coercionErrorPreserved
        }
      }

      if (new URLSearchParams(window.location.search).has('no-activation')) {
        const trigger = document.createElement('button')
        trigger.id = 'no-activation-probe'
        trigger.textContent = 'Run activation probe'
        trigger.addEventListener(
          'click',
          () => {
            const runProbeWithoutActivation = () => {
              if (navigator.userActivation.isActive) {
                requestAnimationFrame(runProbeWithoutActivation)
                return
              }
              setTimeout(async () => {
                document.documentElement.dataset.requestDeviceProbeActive = String(
                  navigator.userActivation.isActive
                )
                if (
                  new URLSearchParams(window.location.search).has(
                    'request-device-dictionary-conversion'
                  )
                ) {
                  window.tests.results.requestDeviceDictionaryConversion =
                    await window.tests.helper.requestDeviceDictionaryConversion()
                  document.documentElement.dataset.requestDeviceProbeResult = 'done'
                  return
                }
                try {
                  const promise = navigator.hid.requestDevice({ filters: [{ vendorId: 0x16c0 }] })
                  if (!(promise instanceof Promise)) {
                    document.documentElement.dataset.requestDeviceProbeResult = 'not-a-Promise'
                    return
                  }
                  document.documentElement.dataset.requestDeviceProbeResult = await promise.then(
                    () => 'resolved',
                    (error) => (error instanceof Error ? error.name : 'Error')
                  )
                } catch (error) {
                  document.documentElement.dataset.requestDeviceProbeResult = `threw:${error instanceof Error ? error.name : 'Error'}`
                }
              }, 0)
            }
            requestAnimationFrame(runProbeWithoutActivation)
          },
          { once: true }
        )
        document.body.appendChild(trigger)
        document.documentElement.dataset.requestDeviceProbeReady = 'true'
      }
      ;(async function () {
        if (new URLSearchParams(window.location.search).has('no-activation')) return
        let isCrossOrigin = false
        if (window !== window.top) {
          try {
            window.parent.location.origin
          } catch {
            isCrossOrigin = true
          }
        }
        const hidUndefined = typeof navigator.hid === 'undefined'

        let getDevicesResult
        try {
          const devices = await navigator.hid.getDevices()
          getDevicesResult = { ok: true, count: devices.length }
        } catch (e) {
          getDevicesResult = { ok: false, name: e.name, message: e.message }
        }
        const result = {
          isTop: window === window.top,
          isCrossOrigin,
          getDevices: getDevicesResult,
          hidUndefined
        }
        window.tests.results.perm = result
      })()
    </script>
  </body>
</html>
