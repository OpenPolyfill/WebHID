<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebHID E2E Test</title>
  </head>
  <body>
    <button id="request-device-btn" style="display: none">Request Device</button>
    <script>
      ;(function () {
        'use strict'
        window.tests = window.tests || { helper: {}, results: {} }

        window.tests.helper.requestDevice = (filters) => {
          const btn = document.getElementById('request-device-btn')
          btn.style.display = 'block'
          const { promise, resolve, reject } = Promise.withResolvers()
          window.tests.results.requestDevice = promise
          btn.onclick = async () => {
            btn.style.display = 'none'
            try {
              const devices = await navigator.hid.requestDevice({ filters: filters || [] })
              window.tests.results.requestDeviceDevices = devices
              resolve(devices.length)
            } catch (e) {
              reject(e)
            }
          }
        }
        window.tests.helper.requestDeviceResult = () => window.tests.results.requestDevice
      })()
    </script>
  </body>
</html>
