name: Test

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: crates -> target
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@b8f4936ae6bd604d21de6c1243d45b013396d81b
        with:
          packages: libudev-dev
          version: v1
      - name: Get kernel version
        id: kernel
        run: echo "release=$(uname -r)" >> "$GITHUB_OUTPUT"
      - name: Cache UHID modules
        id: uhid-modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/uhid-modules
          key: uhid-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel.outputs.release }}
      - &install_uhid_module
        name: Install UHID module
        env:
          UHID_CACHE_HIT: ${{ steps.uhid-modules.outputs.cache-hit }}
        run: |
          set -euo pipefail

          kernel="$(uname -r)"
          module_root="/lib/modules/$kernel"
          cache_dir="$RUNNER_TEMP/uhid-modules"

          if [[ "$UHID_CACHE_HIT" == "true" ]]; then
            sudo cp -a "$cache_dir/." "$module_root/"
            sudo depmod -a "$kernel"
          else
            sudo apt-get update

            extra="linux-modules-extra-$kernel"
            base="linux-modules-$kernel"

            if apt-cache show "$extra" >/dev/null 2>&1; then
              sudo apt-get install -y "$extra"
            elif apt-cache show "$base" >/dev/null 2>&1; then
              sudo apt-get install --reinstall -y "$base"
            else
              echo "::error::No matching kernel modules package for $kernel"
              exit 1
            fi

            sudo depmod -a "$kernel"

            dependencies="$(modprobe --show-depends uhid)"
            mkdir -p "$cache_dir"
            uhid_module_found=false
            while read -r operation module_path _; do
              [[ "$operation" == "insmod" ]] || continue
              [[ "$module_path" == "$module_root/"*.ko* ]] || continue
              relative_path="${module_path#"$module_root"/}"
              install -D -m 0644 "$module_path" "$cache_dir/$relative_path"
              if [[ "${module_path##*/}" == uhid.ko* ]]; then
                uhid_module_found=true
              fi
            done <<< "$dependencies"
            if [[ "$uhid_module_found" != "true" ]]; then
              echo "::error::modprobe uhid resolved no uhid .ko module"
              exit 1
            fi
          fi

          sudo modprobe uhid
          test -c /dev/uhid
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install npm dependencies
        run: npm ci
      - name: Run JavaScript unit tests
        run: npm run test:unit
      - name: Build Rust binaries
        run: npm run build:rs:debug
      - name: Setup uhid + udev rules + webhid group
        run: |
          sudo groupadd --system webhid
          sudo usermod -aG webhid "$(whoami)"
          sudo install -Dm644 manifests/72-webhid-e2e.rules /etc/udev/rules.d/72-webhid-e2e.rules
          sudo modprobe uhid
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Run unit tests
        run: sg webhid -c "npm run test:rs"
      - name: Upload debug binaries
        uses: actions/upload-artifact@v7
        with:
          name: webhid-debug-binaries
          path: |
            crates/target/debug/webhid-daemon
            crates/target/debug/webhid-mock
            crates/target/debug/webhid-native-messaging

  e2e:
    name: WebHID conformance and regression tests
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@b8f4936ae6bd604d21de6c1243d45b013396d81b
        with:
          packages: |
            libatk1.0-0t64
            libcairo-gobject2
            libcairo2
            libdbus-1-3
            libfontconfig1
            libfreetype6
            libgdk-pixbuf-2.0-0
            libglib2.0-0t64
            libgtk-3-0t64
            libpango-1.0-0
            libpangocairo-1.0-0
            libx11-6
            libx11-xcb1
            libxcb-shm0
            libxcb1
            libxcomposite1
            libxcursor1
            libxdamage1
            libxext6
            libxfixes3
            libxi6
            libxrandr2
            libxrender1
          version: v1
      - name: Get kernel version
        id: kernel
        run: echo "release=$(uname -r)" >> "$GITHUB_OUTPUT"
      - name: Cache UHID modules
        id: uhid-modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/uhid-modules
          key: uhid-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel.outputs.release }}
      - *install_uhid_module
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install npm dependencies
        run: npm ci
      - name: Cache harness Firefox
        uses: actions/cache@v6
        with:
          path: ~/.cache/openpolyfill
          key: openpolyfill-firefox-${{ hashFiles('package-lock.json') }}
      - name: Download debug binaries
        uses: actions/download-artifact@v8
        with:
          name: webhid-debug-binaries
          path: crates/target/debug
      - name: Make binaries executable
        run: chmod +x crates/target/debug/webhid-daemon crates/target/debug/webhid-mock crates/target/debug/webhid-native-messaging
      - name: Setup uhid + udev rules + webhid group
        run: |
          sudo groupadd --system webhid
          sudo usermod -aG webhid "$(whoami)"
          sudo install -Dm644 manifests/72-webhid-e2e.rules /etc/udev/rules.d/72-webhid-e2e.rules
          sudo modprobe uhid
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Run conformance, WPT, and regression suites
        run: |
          sg webhid -c "npm run test:conformance"
          sg webhid -c "npm run test:regression"
          sg webhid -c "npm run test:regression:forwarder"
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  benchmark:
    name: Benchmark
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@b8f4936ae6bd604d21de6c1243d45b013396d81b
        with:
          packages: |
            ffmpeg
            libatk1.0-0t64
            libcairo-gobject2
            libcairo2
            libdbus-1-3
            libfontconfig1
            libfreetype6
            libgdk-pixbuf-2.0-0
            libglib2.0-0t64
            libgtk-3-0t64
            libpango-1.0-0
            libpangocairo-1.0-0
            libx11-6
            libx11-xcb1
            libxcb-shm0
            libxcb1
            libxcomposite1
            libxcursor1
            libxdamage1
            libxext6
            libxfixes3
            libxi6
            libxrandr2
            libxrender1
          version: v1
      - name: Get kernel version
        id: kernel
        run: echo "release=$(uname -r)" >> "$GITHUB_OUTPUT"
      - name: Cache UHID modules
        id: uhid-modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/uhid-modules
          key: uhid-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel.outputs.release }}
      - *install_uhid_module
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install npm dependencies
        run: npm ci
      - name: Cache harness Firefox
        uses: actions/cache@v6
        with:
          path: ~/.cache/openpolyfill
          key: openpolyfill-firefox-${{ hashFiles('package-lock.json') }}
      - name: Download debug binaries
        uses: actions/download-artifact@v8
        with:
          name: webhid-debug-binaries
          path: crates/target/debug
      - name: Make binaries executable
        run: chmod +x crates/target/debug/webhid-daemon crates/target/debug/webhid-mock crates/target/debug/webhid-native-messaging
      - name: Setup uhid + udev rules + webhid group
        run: |
          sudo groupadd --system webhid
          sudo usermod -aG webhid "$(whoami)"
          sudo install -Dm644 manifests/72-webhid-e2e.rules /etc/udev/rules.d/72-webhid-e2e.rules
          sudo modprobe uhid
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Run benchmark
        run: sg webhid -c "npm run test:benchmark"
      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
