<template id="webhid-picker-template">
  <style>
    @import url('chrome://global/skin/in-content/common.css');

    :host {
      --bg: var(--in-content-page-background, Canvas);
      --text: var(--in-content-page-color, CanvasText);
      --text-muted: var(--text-color-deemphasized, GrayText);
      --accent: var(--color-accent-primary, AccentColor);
      --accent-text: var(--button-text-color-primary, AccentColorText);
      --danger: #c00;
      --overlay: rgba(0, 0, 0, 0.45);
      --surface-raised: var(--background-color-box, color-mix(in srgb, var(--bg), var(--text) 4%));
      --surface-hover: var(--in-content-button-background-hover, color-mix(in srgb, var(--bg), var(--text) 6%));
      --border-subtle: var(--in-content-border-color, color-mix(in srgb, var(--text), transparent 88%));
      --border-light: var(--in-content-border-color, color-mix(in srgb, var(--text), transparent 85%));
      --border-default: var(--in-content-box-border-color, color-mix(in srgb, var(--text), transparent 80%));
      --border-strong: var(--in-content-box-border-color, color-mix(in srgb, var(--text), transparent 75%));
      --accent-hover: var(--color-accent-primary-hover, color-mix(in srgb, var(--accent), var(--text) 20%));
      --accent-surface: var(--in-content-item-hover, color-mix(in srgb, var(--bg), var(--accent) 10%));
      --accent-selected: color-mix(in srgb, var(--bg), var(--accent) 35%);
      --accent-paired: color-mix(in srgb, var(--bg), var(--accent) 15%);
      --danger-bg: color-mix(in srgb, var(--bg), var(--danger) 10%);
      --danger-border: color-mix(in srgb, var(--bg), var(--danger) 20%);
      --danger-hover-bg: color-mix(in srgb, var(--bg), var(--danger) 15%);
      --shadow: color-mix(in srgb, var(--text), transparent 80%);
      --shadow-drop: drop-shadow(0 6px 20px color-mix(in srgb, var(--text), transparent 65%));
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: monospace;
    }

    .webhid-modal {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      padding: 0;
      margin: 0;
      border: none;
      background: var(--overlay);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 8px 0 0 10px;
      z-index: calc(infinity);
      font-family: var(--font-sans);
      opacity: 0;
      visibility: hidden;
      transition-property: opacity, visibility;
      transition-duration: 0.2s;
    }

    .webhid-modal[open] {
      opacity: 1;
      visibility: visible;
    }

    .webhid-modal::backdrop {
      display: none;
    }

    .webhid-modal-form {
      background: var(--bg);
      border-radius: var(--radius-xl);
      width: min(400px, calc(100vw - 20px));
      max-width: calc(100vw - 20px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      position: relative;
      filter: var(--shadow-drop);
      transform: translateY(-8px);
      opacity: 0;
      transition-property: transform, opacity;
      transition-duration: 0.2s;
    }

    .webhid-modal[open] .webhid-modal-form {
      transform: translateY(0);
      opacity: 1;
    }

    .webhid-modal-form::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 16px;
      border: 9px solid transparent;
      border-top: none;
      border-bottom-color: var(--bg);
    }

    .webhid-modal-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .webhid-modal-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .webhid-modal-content {
      padding: 16px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .webhid-device-list {
      display: flex;
      flex-direction: column;
      max-height: 300px;
      overflow-y: auto;
      padding: 6px 8px;
    }

    .webhid-device-item {
      padding: 12px 16px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface-raised);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .webhid-device-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      opacity: 0.55;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .webhid-device-icon svg {
      width: 24px;
      height: 24px;
    }

    .webhid-device-body {
      flex: 1;
      min-width: 0;
    }

    .webhid-device-item:hover {
      border-color: var(--accent);
      background: var(--accent-surface);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px var(--shadow);
    }

    .webhid-device-item.selected {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      background: var(--accent-selected);
    }

    .webhid-device-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .webhid-device-vendor {
      font-size: 12px;
      color: var(--text-muted);
    }

    .webhid-device-paired {
      background: var(--accent-paired);
      order: -1;
    }

    .webhid-device-iface {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 2px;
    }

    .webhid-device-parse-failed {
      font-size: 11px;
      color: var(--accent);
      margin-top: 2px;
    }

    .webhid-modal-footer {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    button.webhid-cancel-button,
    button.webhid-connect-button.primary {
      min-height: var(--button-min-height, 32px);
      padding: var(--button-padding, 6px 16px);
      border: 1px solid transparent;
      border-radius: var(--button-border-radius, var(--radius-md));
      font-size: var(--button-font-size, var(--font-size-root, 14px));
      font-weight: 600;
      cursor: pointer;
      transition:
        background-color 0.15s,
        border-color 0.15s;
    }

    button.webhid-cancel-button {
      background: transparent;
      color: var(--text);
      border-color: transparent;
    }

    button.webhid-cancel-button:enabled:hover {
      background: var(--button-background-color-hover, var(--surface-hover));
      color: var(--button-text-color-hover, var(--text));
      border-color: transparent;
    }

    button.webhid-connect-button.primary {
      background: var(--button-background-color-primary, var(--accent));
      color: var(--button-text-color-primary, var(--accent-text));
      border-color: var(--button-border-color-primary, transparent);
    }

    button.webhid-connect-button.primary:hover:not(:disabled) {
      background: var(--button-background-color-primary-hover, var(--accent-hover));
      color: var(--button-text-color-primary-hover, var(--accent-text));
      border-color: var(--button-border-color-primary-hover, transparent);
    }

    button.webhid-connect-button.primary:disabled {
      background: var(
        --button-background-color-primary-disabled,
        var(--button-background-color-disabled, var(--surface-hover))
      );
      color: var(
        --button-text-color-primary-disabled,
        var(--button-text-color-disabled, var(--text-muted))
      );
      border-color: var(--button-border-color-primary-disabled, transparent);
      opacity: 0.6;
      cursor: default;
    }

    .webhid-device-radio {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .webhid-no-devices,
    .webhid-error {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted, #888);
      font-size: 0.9em;
      line-height: 1.5;
    }

    .webhid-error {
      color: var(--danger, #f88);
    }
  </style>
  <dialog class="webhid-modal" role="dialog" aria-modal="true" aria-labelledby="webhidModalTitle">
    <form method="dialog" class="webhid-modal-form">
      <div class="webhid-modal-header">
        <h2 id="webhidModalTitle" data-i18n="pickerTitle">Select a HID Device</h2>
      </div>
      <div class="webhid-modal-content">
        <div class="webhid-device-list" id="webhidDeviceList" role="list" aria-live="polite"></div>
        <template id="webhid-device-template">
          <label class="webhid-device-item" tabindex="0" role="option">
            <input type="radio" name="webhid-device" class="webhid-device-radio" />
            <span class="webhid-device-icon" aria-hidden="true"></span>
            <div class="webhid-device-body">
              <div class="webhid-device-name"></div>
              <div class="webhid-device-vendor"></div>
              <div class="webhid-device-iface"></div>
              <div class="webhid-device-parse-failed"></div>
            </div>
          </label>
        </template>
      </div>
      <div class="webhid-modal-footer">
        <button
          type="submit"
          class="webhid-cancel-button"
          id="webhidCancelBtn"
          value="cancel"
          data-i18n="pickerCancel"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="webhid-connect-button primary"
          id="webhidConnectBtn"
          value="selected"
          disabled
          data-i18n="pickerConnect"
        >
          Connect
        </button>
      </div>
    </form>
  </dialog>
</template>
