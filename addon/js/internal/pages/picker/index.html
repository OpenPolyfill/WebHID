<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="pickerTitle">Select a HID Device</title>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link rel="stylesheet" href="../../../../css/shared.css" />
    <link rel="stylesheet" href="../../../../css/native.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }
      #picker {
        --accent-selected: color-mix(in srgb, var(--bg), var(--accent) 35%);
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        max-width: 400px;
        margin: 0 auto;
      }
      .picker-header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }
      .picker-header h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        text-transform: none;
        color: var(--text);
      }
      #picker-list {
        overflow-y: auto;
        flex: 1;
        padding: 12px 20px;
        min-height: 0;
      }
      .picker-footer {
        padding: 12px 20px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-shrink: 0;
      }
      .webhid-device-item {
        margin-bottom: 8px;
      }
      .webhid-device-list {
        padding: 0;
        max-height: none;
      }
    </style>
  </head>
  <body>
    <div id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-heading">
      <div class="picker-header">
        <h2 id="picker-heading" data-i18n="pickerTitle">Select a HID Device</h2>
      </div>
      <div id="picker-list" class="webhid-device-list" role="list" aria-live="polite"></div>
      <div class="picker-footer">
        <button id="picker-cancel" class="webhid-cancel-button" data-i18n="pickerCancel">
          Cancel
        </button>
        <button
          id="picker-connect"
          class="webhid-connect-button primary"
          disabled
          data-i18n="pickerConnect"
        >
          Connect
        </button>
      </div>
    </div>
    <script src="../../../../js/utils/bootstrap.js"></script>
    <script src="../../../../js/utils/i18n.js"></script>
    <script src="../../../../js/utils/resource.js"></script>
    <script src="../../../../js/utils/http.js"></script>
    <script src="../../../../js/utils/logger.js"></script>
    <script src="../../../../js/utils/device-filters.js"></script>
    <script src="../../../../js/utils/device.js"></script>
    <script src="../../../../js/utils/settings.js"></script>
    <script src="../../../../js/utils/native-theme.js"></script>
    <script src="index.js"></script>
  </body>
</html>
